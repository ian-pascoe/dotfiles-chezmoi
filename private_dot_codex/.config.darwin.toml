multi_agent = true
undo = true
goals = true
memories = true
terminal_resize_reflow = true
prevent_idle_sleep = true
js_repl = false
chronicle = true

[agents]
max_threads = 20

[memories]
generate_memories = true
use_memories = true

[shell_environment_policy]
inherit = "all"

[shell_environment_policy.set]
NODE_REPL_TRUSTED_BROWSER_CLIENT_SHA256S = "9230e2bd8b24b7ac7a0ba6774c64bf0d78ecdabbdd91d0ed627b02a587bae2df"

[model_providers.opencode_go]
name = "OpenCode Go"
base_url = "https://opencode.ai/zen/go/v1"
env_key = "OPENCODE_API_KEY"

[desktop]
appearanceLightCodeThemeId = "solarized"
appearanceDarkCodeThemeId = "solarized"
usePointerCursors = true
appearanceTheme = "system"
followUpQueueMode = "queue"
reviewDelivery = "detached"
dictationDictionary = []
selected-avatar-id = "custom:mini-jesus"
keepRemoteControlAwakeWhilePluggedIn = true
git-pull-request-merge-method = "squash"
