skill = "#d33682"

[desktop.appearanceDarkChromeTheme]
accent = "#d30102"
contrast = 60
ink = "#839496"
opaqueWindows = false
surface = "#002b36"

[desktop.appearanceDarkChromeTheme.fonts]
code = '"GeistMono Nerd Font Mono"'
ui = '"Geist"'

[desktop.appearanceDarkChromeTheme.semanticColors]
diffAdded = "#859900"
