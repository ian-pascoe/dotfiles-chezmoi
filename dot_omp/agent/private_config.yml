providers: 
  autoThinkingModel: online
  autoThinkingMaxEffort: max
  memoryModel: online
disabledProviders: 
  - codex
  - opencode
  - claude
  - pi
symbolPreset: nerd
theme: 
  dark: dark-dracula
  light: light
setupVersion: 1
statusLine: 
  transparent: true
  compactThinkingLevel: true
  preset: custom
  separator: powerline-thin
  showHookStatus: false
  leftSegments: 
    - model
    - context_pct
  rightSegments: 
    - git
    - path
  segmentOptions: 
    git: 
      showStaged: false
      showUnstaged: false
      showUntracked: false
task: 
  showResolvedModelBadge: true
  enableLsp: true
  eager: default
  maxConcurrency: 0
  maxRecursionDepth: -1
  maxRuntimeMs: 0
  softRequestBudget: 0
  isolation: 
    mode: none
  agentAdvisor: 
    task: "off"
  agentModelOverrides: 
    designer: opencode-go/kimi-k3
    librarian: openai-codex/gpt-5.6-luna:medium
    reviewer: openai-codex/gpt-5.6-sol:xhigh
    scout: openai-codex/gpt-5.6-luna:medium
    security-reviewer: openai-codex/gpt-5.6-sol:xhigh
    task: openai-codex/gpt-5.6-luna:max
  disabledAgents: 
    - sonic
hideThinkingBlock: false
colorBlindMode: false
terminal: 
  showProgress: false
tui: 
  tight: true
display: 
  showTokenUsage: true
  cacheMissMarker: true
defaultThinkingLevel: auto
textVerbosity: low
advisor: 
  enabled: false
stt: 
  enabled: false
  modelName: parakeet
startup: 
  quiet: false
  changelogMode: expanded
features: 
  unexpectedStopDetection: false
contextPromotion: 
  enabled: false
compaction: 
  strategy: context-full
memory: 
  backend: "off"
autolearn: 
  enabled: false
edit: 
  mode: hashline
lsp: 
  diagnosticsOnEdit: true
modelRoles: 
  default: openai-codex/gpt-5.6-sol:medium
  advisor: openai-codex/gpt-5.6-sol:xhigh
  task: openai-codex/gpt-5.6-luna:max
  plan: openai-codex/gpt-5.6-sol:xhigh
  tiny: openai-codex/gpt-5.6-luna:medium
  slow: openai-codex/gpt-5.6-sol:xhigh
  smol: openai-codex/gpt-5.6-luna:max
  designer: opencode-go/kimi-k3:max
  commit: openai-codex/gpt-5.6-luna:low
  vision: openai-codex/gpt-5.6-sol:medium
  EXPLORE: openai-codex/gpt-5.6-luna:medium
  RESEARCH: openai-codex/gpt-5.6-luna:medium
dev: 
  autoqaConsent: granted
codexResets: 
  autoRedeem: unset
commands: 
  enableOpencodeUser: false
  enableOpencodeProject: false
  enableClaudeProject: false
  enableClaudeUser: false
tools: 
  approvalMode: yolo
tier: 
  advisor: inherit
astGrep: 
  enabled: true
generate_image: 
  enabled: true
ask: 
  enabled: false
browser: 
  enabled: true
hindsight: 
  scoping: per-project-tagged
todo: 
  reminders: false