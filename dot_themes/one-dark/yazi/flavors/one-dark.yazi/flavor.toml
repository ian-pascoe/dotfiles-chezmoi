# One Dark local Yazi flavor

[mgr]
cwd = { fg = "#61afef" }
find_keyword = { fg = "#e5c07b", bold = true, italic = true }
find_position = { fg = "#c678dd", bg = "reset", bold = true, italic = true }
marker_copied = { fg = "#98c379", bg = "#98c379" }
marker_cut = { fg = "#e06c75", bg = "#e06c75" }
marker_marked = { fg = "#56b6c2", bg = "#56b6c2" }
marker_selected = { fg = "#e5c07b", bg = "#e5c07b" }
count_copied = { fg = "#282c34", bg = "#98c379" }
count_cut = { fg = "#282c34", bg = "#e06c75" }
count_selected = { fg = "#282c34", bg = "#e5c07b" }
border_symbol = "│"
border_style = { fg = "#5c6370" }

[tabs]
active = { fg = "#282c34", bg = "#61afef", bold = true }
inactive = { fg = "#61afef", bg = "#2c323c" }

[mode]
normal_main = { fg = "#282c34", bg = "#61afef", bold = true }
normal_alt = { fg = "#61afef", bg = "#2c323c" }
select_main = { fg = "#282c34", bg = "#56b6c2", bold = true }
select_alt = { fg = "#56b6c2", bg = "#2c323c" }
unset_main = { fg = "#282c34", bg = "#c678dd", bold = true }
unset_alt = { fg = "#c678dd", bg = "#2c323c" }

[status]
perm_sep = { fg = "#5c6370" }
perm_type = { fg = "#61afef" }
perm_read = { fg = "#98c379" }
perm_write = { fg = "#e5c07b" }
perm_exec = { fg = "#e06c75" }
progress_label = { fg = "#abb2bf", bold = true }
progress_normal = { fg = "#98c379", bg = "#3e4451" }
progress_error = { fg = "#e5c07b", bg = "#e06c75" }

[pick]
border = { fg = "#61afef" }
active = { fg = "#c678dd", bold = true }
inactive = {}

[input]
border = { fg = "#61afef" }
title = {}
value = {}
selected = { reversed = true }

[cmp]
border = { fg = "#61afef" }

[tasks]
border = { fg = "#61afef" }
title = {}
hovered = { fg = "#c678dd", bold = true }

[which]
border = { fg = "#61afef" }
cand = { fg = "#56b6c2" }
rest = { fg = "#7f848e" }
desc = { fg = "#c678dd" }
separator = "  "
separator_style = { fg = "#5c6370" }

[help]
on = { fg = "#56b6c2" }
run = { fg = "#c678dd" }
hovered = { reversed = true, bold = true }
footer = { fg = "#282c34", bg = "#abb2bf" }

[spot]
border = { fg = "#61afef" }
title = { fg = "#61afef" }
tbl_col = { fg = "#56b6c2" }
tbl_cell = { fg = "#c678dd", bg = "#3e4451" }

[notify]
title_info = { fg = "#98c379" }
title_warn = { fg = "#e5c07b" }
title_error = { fg = "#e06c75" }

[filetype]
rules = [
  { mime = "**/image/*", fg = "#56b6c2" },
  { mime = "**/{audio,video}/*", fg = "#e5c07b" },
  { mime = "**/application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#c678dd" },
  { mime = "**/application/{pdf,doc,rtf}", fg = "#98c379" },
  { mime = "vfs/{absent,stale}", fg = "#7f848e" },
  { url = "*", fg = "#abb2bf" },
  { url = "*/", fg = "#61afef" },
]

