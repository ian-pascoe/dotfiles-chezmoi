# Dracula local Yazi flavor

[mgr]
cwd = { fg = "#bd93f9" }
find_keyword = { fg = "#f1fa8c", bold = true, italic = true }
find_position = { fg = "#bd93f9", bg = "reset", bold = true, italic = true }
marker_copied = { fg = "#50fa7b", bg = "#50fa7b" }
marker_cut = { fg = "#ff5555", bg = "#ff5555" }
marker_marked = { fg = "#8be9fd", bg = "#8be9fd" }
marker_selected = { fg = "#f1fa8c", bg = "#f1fa8c" }
count_copied = { fg = "#282a36", bg = "#50fa7b" }
count_cut = { fg = "#282a36", bg = "#ff5555" }
count_selected = { fg = "#282a36", bg = "#f1fa8c" }
border_symbol = "│"
border_style = { fg = "#6272a4" }

[tabs]
active = { fg = "#282a36", bg = "#bd93f9", bold = true }
inactive = { fg = "#bd93f9", bg = "#44475a" }

[mode]
normal_main = { fg = "#282a36", bg = "#bd93f9", bold = true }
normal_alt = { fg = "#bd93f9", bg = "#44475a" }
select_main = { fg = "#282a36", bg = "#8be9fd", bold = true }
select_alt = { fg = "#8be9fd", bg = "#44475a" }
unset_main = { fg = "#282a36", bg = "#bd93f9", bold = true }
unset_alt = { fg = "#bd93f9", bg = "#44475a" }

[status]
perm_sep = { fg = "#6272a4" }
perm_type = { fg = "#bd93f9" }
perm_read = { fg = "#50fa7b" }
perm_write = { fg = "#f1fa8c" }
perm_exec = { fg = "#ff5555" }
progress_label = { fg = "#f8f8f2", bold = true }
progress_normal = { fg = "#50fa7b", bg = "#6272a4" }
progress_error = { fg = "#f1fa8c", bg = "#ff5555" }

[pick]
border = { fg = "#bd93f9" }
active = { fg = "#bd93f9", bold = true }
inactive = {}

[input]
border = { fg = "#bd93f9" }
title = {}
value = {}
selected = { reversed = true }

[cmp]
border = { fg = "#bd93f9" }

[tasks]
border = { fg = "#bd93f9" }
title = {}
hovered = { fg = "#bd93f9", bold = true }

[which]
border = { fg = "#bd93f9" }
cand = { fg = "#8be9fd" }
rest = { fg = "#6272a4" }
desc = { fg = "#bd93f9" }
separator = "  "
separator_style = { fg = "#6272a4" }

[help]
on = { fg = "#8be9fd" }
run = { fg = "#bd93f9" }
hovered = { reversed = true, bold = true }
footer = { fg = "#282a36", bg = "#f8f8f2" }

[spot]
border = { fg = "#bd93f9" }
title = { fg = "#bd93f9" }
tbl_col = { fg = "#8be9fd" }
tbl_cell = { fg = "#bd93f9", bg = "#6272a4" }

[notify]
title_info = { fg = "#50fa7b" }
title_warn = { fg = "#f1fa8c" }
title_error = { fg = "#ff5555" }

[filetype]
rules = [
  { mime = "**/image/*", fg = "#8be9fd" },
  { mime = "**/{audio,video}/*", fg = "#f1fa8c" },
  { mime = "**/application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#bd93f9" },
  { mime = "**/application/{pdf,doc,rtf}", fg = "#50fa7b" },
  { mime = "vfs/{absent,stale}", fg = "#6272a4" },
  { url = "*", fg = "#f8f8f2" },
  { url = "*/", fg = "#bd93f9" },
]
