#:schema https://raw.githubusercontent.com/openai/codex/refs/heads/main/codex-rs/core/config.schema.json

model = "gpt-5.5"
personality = "pragmatic"
model_reasoning_effort = "high"
plan_mode_reasoning_effort = "xhigh"
approval_policy = "never"
approvals_reviewer = "user"
sandbox_mode = "danger-full-access"
suppress_unstable_features_warning = true

notify = [
  "/Users/ianpascoe/.codex/computer-use/Codex Computer Use.app/Contents/SharedSupport/SkyComputerUseClient.app/Contents/MacOS/SkyComputerUseClient",
  "turn-ended",
]

[features]
hooks = true
multi_agent = true
remote_connections = true
undo = true
goals = true
memories = true
terminal_resize_reflow = true
prevent_idle_sleep = true
js_repl = false

[memories]
generate_memories = true
use_memories = true

[shell_environment_policy]
inherit = "all"

[desktop]
appearanceLightCodeThemeId = "catppuccin"
appearanceDarkCodeThemeId = "catppuccin"
usePointerCursors = true
appearanceTheme = "system"
followUpQueueMode = "queue"
reviewDelivery = "detached"
dictationDictionary = []
selected-avatar-id = "custom:mini-jesus"
keepRemoteControlAwakeWhilePluggedIn = true
git-pull-request-merge-method = "squash"
git-show-sidebar-pr-icons = true
git-create-pull-request-as-draft = true
worktree-keep-count = 10
git-commit-instructions = "**Always** use conventional commit messages."
git-pr-instructions = "**Always** use a conventional commit message for PR titles."
defaultTerminalLocation = "right"

[desktop.appearanceLightChromeTheme]
accent = "#8839ef"
contrast = 45
ink = "#4c4f69"
opaqueWindows = false
surface = "#eff1f5"

[desktop.appearanceLightChromeTheme.fonts]
code = '"JetBrainsMono NF"'
ui = '"JetBrains Mono NF"'

[desktop.appearanceLightChromeTheme.semanticColors]
diffAdded = "#40a02b"
diffRemoved = "#d20f39"
skill = "#8839ef"

[desktop.appearanceDarkChromeTheme]
accent = "#cba6f7"
contrast = 60
ink = "#cdd6f4"
opaqueWindows = false
surface = "#1e1e2e"

[desktop.appearanceDarkChromeTheme.fonts]
code = '"JetBrainsMono NF"'
ui = '"JetBrains Mono NF"'

[desktop.appearanceDarkChromeTheme.semanticColors]
diffAdded = "#a6e3a1"
diffRemoved = "#f38ba8"
skill = "#cba6f7"

[desktop.open-in-target-preferences]
global = "ghostty"

[mcp_servers.caplets]
command = "caplets"
args = ["attach"]
env_vars = [
  "HOME",
  "CAPLETS_REMOTE_URL",
  "CAPLETS_REMOTE_USER",
  "CAPLETS_REMOTE_PASSWORD",
  "GH_TOKEN",
  "PLAYWRIGHT_MCP_EXTENSION_TOKEN",
  "GOOGLE_EMAIL",
  "DEFAULT_BROWSER_EXECECUTABLE_PATH",
  "DEFAULT_BROWSER_USER_DATA_DIR",
  "CAMOUFOX_EXECECUTABLE_PATH",
  "CAMOUFOX_USER_DATA_DIR",
]

[mcp_servers.node_repl]
args = []
command = "/Applications/Codex.app/Contents/Resources/cua_node/bin/node_repl"
startup_timeout_sec = 120

[mcp_servers.node_repl.env]
NODE_REPL_NATIVE_PIPE_CONNECT_TIMEOUT_MS = "1000"
NODE_REPL_NODE_MODULE_DIRS = "/Applications/Codex.app/Contents/Resources/cua_node/lib/node_modules"
NODE_REPL_NODE_PATH = "/Applications/Codex.app/Contents/Resources/cua_node/bin/node"
NODE_REPL_TRUSTED_CODE_PATHS = "/Users/ianpascoe/.codex"
CODEX_HOME = "/Users/ianpascoe/.codex"
NODE_REPL_TRUSTED_BROWSER_CLIENT_SHA256S = "27dca86fd6b571c49414a4b78e46b57bcf683a46cd1319799c11fbb6cfae3110"
BROWSER_USE_AVAILABLE_BACKENDS = "chrome,iab"
NODE_REPL_INSTRUCTIONS_USE_CASE_BROWSER = "Control the in-app browser in conjunction with the Browser Plugin."
NODE_REPL_INSTRUCTIONS_USE_CASE_CHROME = "Control the Chrome browser in conjunction with the Chrome Plugin. Prefer this method of controlling Chrome over alternatives (such as Computer Use) unless the user explicitly mentions an alternative."
BROWSER_USE_CODEX_APP_BUILD_FLAVOR = "prod"
BROWSER_USE_CODEX_APP_VERSION = "26.609.41114"
CODEX_CLI_PATH = "/Applications/Codex.app/Contents/Resources/codex"

[tui]
status_line = [
  "model-with-reasoning",
  "fast-mode",
  "context-used",
  "project-name",
  "git-branch",
  "branch-changes",
