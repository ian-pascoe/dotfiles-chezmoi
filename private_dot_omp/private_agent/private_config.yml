providers:
  autoThinkingModel: online
disabledProviders:
  - codex
  - opencode
  - claude
  - pi
symbolPreset: nerd
theme:
  dark: dark-catppuccin
  light: light-catppuccin
setupVersion: 1
statusLine:
  transparent: true
  compactThinkingLevel: true
  preset: custom
  separator: powerline-thin
  showHookStatus: false
  leftSegments:
    - model
    - context_pct
  rightSegments:
    - git
    - path
  segmentOptions:
    git:
      showStaged: false
      showUnstaged: false
      showUntracked: false
task:
  showResolvedModelBadge: true
  enableLsp: true
  eager: default
  maxConcurrency: 0
  maxRecursionDepth: -1
  maxRuntimeMs: 0
  softRequestBudget: 0
  isolation:
    mode: none
hideThinkingBlock: false
colorBlindMode: false
terminal:
  showProgress: false
tui:
  tight: true
display:
  showTokenUsage: false
defaultThinkingLevel: auto
textVerbosity: low
advisor:
  enabled: false
  subagents: false
stt:
  enabled: false
  modelName: parakeet
startup:
  quiet: false
  changelogMode: expanded
features:
  unexpectedStopDetection: false
contextPromotion:
  enabled: false
compaction:
  strategy: context-full
memory:
  backend: "off"
autolearn:
  enabled: false
edit:
  mode: hashline
lsp:
  diagnosticsOnEdit: true
modelRoles:
  default: openai-codex/gpt-5.6-sol:high
  advisor: openai-codex/gpt-5.6-sol:max
  task: openai-codex/gpt-5.6-sol:high
  plan: openai-codex/gpt-5.6-sol:max
  tiny: openai-codex/gpt-5.6-luna:max
  commit: openai-codex/gpt-5.6-luna:high
  slow: openai-codex/gpt-5.6-sol:xhigh
  smol: openai-codex/gpt-5.6-sol:low
  vision: openai-codex/gpt-5.6-sol:high
  designer: openai-codex/gpt-5.6-sol:high
dev:
  autoqaConsent: granted
codexResets:
  autoRedeem: unset
commands:
  enableOpencodeUser: false
  enableOpencodeProject: false
  enableClaudeProject: false
  enableClaudeUser: false
tools:
  approvalMode: yolo
tier:
  advisor: inherit
astGrep:
  enabled: true
generate_image:
  enabled: true
ask:
  enabled: false
browser:
  enabled: false
