[settings]
aqua.github_attestations = false

# Shared CLI ownership lives here. OS packages/libraries stay in apt, Scoop and Brew.
[tools]
7zip = "latest"
actionlint = "latest"
ast-grep = "latest"
awscli = "latest"
bat = "latest"
# These upstream packages are Linux-only
btop = { version = "latest", os = ["linux"] }
bun = "latest"
cargo-binstall = "latest"
cargo-deny = "latest"
chezmoi = "latest"
clang-format = "latest"
cmake = "latest"
codex = "latest"
dart = "latest"
delta = "latest"
difftastic = "latest"
dotnet = "latest"
fastfetch = "latest"
fd = "latest"
ffmpeg = "latest"
fzf = "latest"
gh = "latest"
git-lfs = "latest"
glow = "latest"
go = "latest"
google-java-format = "latest"
goreleaser = "latest"
gradle = "latest"
helm = "latest"
herdr = "latest"
imagemagick = "latest"
java = ["latest", "corretto-21"]
jq = "latest"
k9s = "latest"
ktlint = "latest"
kubectl = "latest"
lazydocker = "latest"
lazygit = "latest"
lsd = "latest"
lua = "latest"
lua-language-server = "latest"
markdownlint-cli2 = "latest"
marksman = "latest"
mold = { version = "latest", os = ["linux"] }
neovim = "latest"
ninja = "latest"
node = "latest"
nub = { version = "latest", allow_builds = ["@nubjs/nub"] }
nushell = "latest"
# The PHP backend builds from source; system development libraries are still required.
php = { version = "latest", os = ["linux", "macos"] }
pipx = "latest"
playwright = "latest"
pnpm = "latest"
powershell = "latest"
python = ["latest", "3.13"]
resvg = "latest"
ripgrep = "latest"
ruby = "latest"
ruff = "latest"
rust = "stable"
sccache = "latest"
semgrep = "latest"
shellcheck = "latest"
shfmt = "latest"
sqlite = "latest"
starship = "latest"
stylua = "latest"
# Debian 13 has no compatible mise Swift download; opt in per project on supported Linux distros.
swift = { version = "latest", os = ["macos"] }
syncthing = "latest"
taplo = "latest"
terraform = "latest"
terraform-ls = "latest"
tmux = { version = "latest", os = ["linux", "macos"] }
tree-sitter = "latest"
uv = "latest"
yazi = "latest"
yq = "latest"
yt-dlp = "latest"
zellij = "latest"
zig = "latest"
zls = "latest"
zoxide = "latest"

# Explicit backends cover tools without a registry shorthand.
# R packages (including languageserver) must be installed into the selected R separately.
"conda:r-base" = { version = "latest", os = ["linux", "macos", "windows/x64"] }

"dotnet:csharp-ls" = "latest"
"dotnet:csharpier" = "latest"

"gem:ruby-lsp" = "latest"
# Projects using `bundle exec rubocop` must also declare it in their Gemfile.
"gem:rubocop" = "latest"

# Official clangd archives target x64; avoid the indexing-tools/debug-symbols assets.
"github:clangd/clangd" = { version = "latest", asset_pattern = 'clangd-{{ os(macos="mac") }}-{{ version }}.zip', os = [
  "linux/x64",
  "macos/x64",
  "windows/x64",
] }
"github:PHP-CS-Fixer/PHP-CS-Fixer" = { version = "latest", asset_pattern = "php-cs-fixer.phar", bin = "php-cs-fixer", os = [
  "linux",
  "macos",
] }
# `air` in the registry is the Go live-reload tool, not Posit's R formatter.
"github:posit-dev/air" = "latest"

"go:github.com/go-delve/delve/cmd/dlv" = "latest"
"go:github.com/simeji/jid/cmd/jid" = "latest"
"go:golang.org/x/tools/cmd/goimports" = "latest"
"go:golang.org/x/tools/gopls" = "latest"
"go:mvdan.cc/gofumpt" = "latest"

"cargo:cargo-audit" = "latest"
"cargo:cargo-cache" = "latest"
"cargo:cargo-edit" = "latest"
"cargo:cargo-nextest" = "latest"
"cargo:cargo-outdated" = "latest"
"cargo:cargo-run-bin" = "latest"
"cargo:cargo-update" = "latest"
"cargo:cargo-watch" = "latest"
"cargo:cargo-zigbuild" = "latest"
"cargo:cross" = "latest"
"cargo:lspctl" = "latest"

# Low-download packages: npm provenance points to anomalyco/terminal-control's npm-release.yml.
"npm:@kitlangton/terminal-control-linux-x64-gnu" = { version = "latest", os = [
  "linux/x64",
], allow_low_downloads = true }
"npm:@kitlangton/terminal-control-linux-arm64-gnu" = { version = "latest", os = [
  "linux/arm64",
], allow_low_downloads = true }
"npm:@kitlangton/terminal-control-darwin-arm64" = { version = "latest", os = [
  "macos/arm64",
], allow_low_downloads = true }
"npm:@kitlangton/terminal-control-darwin-x64" = { version = "latest", os = [
  "macos/x64",
], allow_low_downloads = true }

"npm:@earendil-works/pi-coding-agent" = "latest"
"npm:@firecrawl/anydoc" = "latest"
"npm:@googleworkspace/cli" = "latest"
"npm:agent-browser" = "latest"
"npm:hunkdiff" = "latest"
"npm:impeccable" = "latest"

"pipx:browser-use" = "latest"
"pipx:camoufox" = "latest"
"pipx:pyflakes" = "latest"
"pipx:pytest" = "latest"
"pipx:spotdl" = "latest"
"pipx:trafilatura" = "latest"
